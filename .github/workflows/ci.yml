name: CI - Build, Test, Docker, Sandbox Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TaskManager.sln

      - name: Build
        run: dotnet build TaskManager.sln -c Release --no-restore --warnaserror

      - name: Unit tests
        run: dotnet test TaskManager.sln -c Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Docker image build
        run: docker build --tag devops-task-manager:${{ github.sha }} .

      - name: Deploy container to CI sandbox
        run: |
          docker run -d --rm --name task-manager-ci -p 8080:8080 devops-task-manager:${{ github.sha }}
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs task-manager-ci
          exit 1

      - name: End-to-end smoke test against deployed artifact
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Export Docker artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save devops-task-manager:${{ github.sha }} -o task-manager-image.tar

      - name: Upload Docker artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-manager-image
          path: task-manager-image.tar
          retention-days: 7

      - name: Print app logs
        if: always()
        run: docker logs task-manager-ci 2>/dev/null || true

      - name: Stop sandbox
        if: always()
        run: docker rm -f task-manager-ci 2>/dev/null || true
